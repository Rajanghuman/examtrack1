name: examtrack
description: India's smartest govt exam guide
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.1.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.1
  shared_preferences: ^2.3.1
  http: ^1.2.1
  xml: ^6.5.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^9.0.0
  cupertino_icons: ^1.0.6
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3
  flutter_markdown_plus: ^1.0.7
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  image: ^4.2.0
  path_provider: ^2.1.5
  firebase_storage: ^12.2.0
  gallery_saver_plus: 3.2.9
  cloud_functions: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
